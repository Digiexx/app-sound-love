<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#17082d">

    <meta
        name="description"
        content="Sound Love: suas músicas, suas preferidas e seus momentos."
    >

    <title>Sound Love</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="imagens/icons/icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="imagens/icons/icon-192.png"
    >

    <meta name="theme-color" content="#080808">

    <link rel="stylesheet" href="acesso.css">

</head>

<body>

    <div class="shell">

        <!-- Menu para computadores -->
        <aside id="sidebar">

            <a class="brand" href="#inicio">
                ♡ SOUND <b>LOVE</b>
            </a>

            <p class="eyebrow">
                SUA COLEÇÃO. SEU MOMENTO.
            </p>

            <nav
                id="desktop-nav"
                aria-label="Navegação principal"
            ></nav>

            <div class="side-art">
                <span>
                    Entre no seu<br>
                    próprio ritmo.
                </span>
            </div>

            <small>
                Feito para os seus momentos.
            </small>

        </aside>

        <!-- Conteúdo das páginas -->
        <main>

            <header>

                <a class="brand" href="#inicio">
                    SOUND <b>LOVE</b>
                </a>

                <div class="header-actions">

                    <button
                        type="button"
                        data-action="search"
                        aria-label="Buscar músicas"
                    >
                        ⌕
                    </button>

                    <button
                        type="button"
                        class="theme-trigger mood-trigger"
                        data-action="open-themes"
                        aria-label="Escolher seu clima"
                        title="Seu clima hoje"
                    >
                        <svg
                            width="23"
                            height="23"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M12 3c1 4-2 5-2 8 0 1.3.8 2.2 2 2.5 2-1.5 3-3.5 2.5-6 3 2.5 5.5 5.3 5.5 8.5a8 8 0 0 1-16 0c0-3 1.5-5.5 4-8-.3 2 .2 3.3 1 4C8.5 8 11 6 12 3Z"/>
                        </svg>
                    </button>

                </div>

            </header>

            <div id="page"></div>

        </main>

    </div>

    <!-- Player compacto -->
    <div id="mini"></div>

    <!-- Navegação para celulares -->
    <nav
        id="bottom-nav"
        aria-label="Navegação para celular"
    ></nav>

    <!-- Classificação, fila, temas e outros painéis -->
    <dialog id="modal" aria-label="Painel do Sound Love">

        <div id="modal-content"></div>

    </dialog>

    <!-- Mensagens de confirmação -->
    <div
        id="toast"
        role="status"
        aria-live="polite"
    ></div>

    <!-- Reprodução dos arquivos de áudio -->
    <audio id="audio" preload="metadata"></audio>

    <!-- Importação do backup de preferências -->
    <input
        type="file"
        id="import"
        accept=".json,application/json"
        aria-label="Importar backup de preferências"
        hidden
    >

    <!-- A ordem destes arquivos é importante -->
    <script src="categorias.js"></script>
    <script src="musicas.js"></script>
    <script src="script.js"></script>

    <script src="acesso.js"></script>

</body>

</html>
