<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#17082d">

    <meta
        name="description"
        content="Sound Love: suas músicas, suas preferidas e seus momentos."
    >

    <title>Sound Love</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="shell">

        <!-- Menu para computadores -->
        <aside id="sidebar">

            <a class="brand" href="#inicio">
                ♡ SOUND <b>LOVE</b>
            </a>

            <p class="eyebrow">
                SUA COLEÇÃO. SEU MOMENTO.
            </p>

            <nav
                id="desktop-nav"
                aria-label="Navegação principal"
            ></nav>

            <div class="side-art">
                <span>
                    Entre no seu<br>
                    próprio ritmo.
                </span>
            </div>

            <small>
                Feito para os seus momentos.
            </small>

        </aside>

        <!-- Conteúdo das páginas -->
        <main>

            <header>

                <a class="brand" href="#inicio">
                    SOUND <b>LOVE</b>
                </a>

                <div class="header-actions">

                    <button
                        type="button"
                        data-action="search"
                        aria-label="Buscar músicas"
                    >
                        ⌕
                    </button>

                    <button
                        type="button"
                        data-action="settings"
                        aria-label="Abrir ajustes"
                    >
                        ⚙
                    </button>

                </div>

            </header>

            <div id="page"></div>

        </main>

    </div>

    <!-- Player compacto -->
    <div id="mini"></div>

    <!-- Navegação para celulares -->
    <nav
        id="bottom-nav"
        aria-label="Navegação para celular"
    ></nav>

    <!-- Classificação, fila, temas e outros painéis -->
    <dialog id="modal" aria-label="Painel do Sound Love">

        <div id="modal-content"></div>

    </dialog>

    <!-- Mensagens de confirmação -->
    <div
        id="toast"
        role="status"
        aria-live="polite"
    ></div>

    <!-- Reprodução dos arquivos de áudio -->
    <audio id="audio" preload="metadata"></audio>

    <!-- Importação do backup de preferências -->
    <input
        type="file"
        id="import"
        accept=".json,application/json"
        aria-label="Importar backup de preferências"
        hidden
    >

    <!-- A ordem destes arquivos é importante -->
    <script src="categorias.js"></script>
    <script src="musicas.js"></script>
    <script src="script.js"></script>

</body>

</html>
