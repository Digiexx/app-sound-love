name: Publicar Sound Love

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sound-love-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar app e gerar versão automática
        env:
          SOUND_COMMIT: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          origem = Path(".")
          destino = Path("_site")

          ignorados = {
              ".git",
              ".github",
              ".vscode",
              "node_modules",
              "corel",
              "_site"
          }

          destino.mkdir(exist_ok=True)

          for item in origem.iterdir():
              if item.name.startswith(".") or item.name in ignorados:
                  continue

              alvo = destino / item.name

              if item.is_dir():
                  shutil.copytree(item, alvo, dirs_exist_ok=True)
              elif item.is_file():
                  shutil.copy2(item, alvo)

          versao = os.environ["SOUND_COMMIT"]

          (destino / "versao.json").write_text(
              json.dumps({"versao": versao}),
              encoding="utf-8"
          )

          pagina = destino / "index.html"
          html = pagina.read_text(encoding="utf-8")

          html = re.sub(
              r'<meta\s+name=["\']sound-love-versao["\'][^>]*>',
              "",
              html,
              flags=re.IGNORECASE
          )

          marcador = (
              '<meta name="sound-love-versao" '
              f'content="{versao}">'
          )

          html, quantidade = re.subn(
              r"</head\s*>",
              lambda resultado: marcador + "\n" + resultado.group(0),
              html,
              count=1,
              flags=re.IGNORECASE
          )

          if quantidade != 1:
              raise RuntimeError("Não foi encontrado </head> no index.html.")

          pagina.write_text(html, encoding="utf-8")

          worker = destino / "service-worker.js"
          codigo = worker.read_text(encoding="utf-8")

          worker.write_text(
              f"/* Publicação: {versao} */\n" + codigo,
              encoding="utf-8"
          )

          # Identifica o conteúdo de cada arquivo publicado.
          import hashlib

          bloco_bytes = 1024 * 1024

          extensoes = {
              ".html", ".css", ".js", ".json",
              ".png", ".jpg", ".jpeg", ".webp",
              ".svg", ".ico", ".gif", ".avif",
              ".woff", ".woff2", ".ttf", ".otf",
              ".mp3", ".m4a", ".ogg", ".wav"
          }

          arquivos = []

          for arquivo in sorted(destino.rglob("*")):
              if not arquivo.is_file():
                  continue

              relativo = arquivo.relative_to(destino)
              caminho = relativo.as_posix()

              if any(
                  parte.startswith(".")
                  for parte in relativo.parts
              ):
                  continue

              if caminho in {
                  "versao.json",
                  "catalogo-offline.json"
              }:
                  continue

              if arquivo.suffix.lower() not in extensoes:
                  continue

              identificacao = hashlib.sha256()
              blocos = []

              # Lê músicas grandes em partes pequenas.
              with arquivo.open("rb") as conteudo:
                  for trecho in iter(
                      lambda: conteudo.read(bloco_bytes),
                      b""
                  ):
                      identificacao.update(trecho)

                      blocos.append(
                          hashlib.sha256(trecho).hexdigest()
                      )

              arquivos.append({
                  "caminho": caminho,
                  "sha256": identificacao.hexdigest(),
                  "tamanho": arquivo.stat().st_size,
                  "blocos": blocos
              })

          catalogo = {
              "formato": 1,
              "versao": versao,
              "blocoBytes": bloco_bytes,
              "arquivos": arquivos
          }

          (destino / "catalogo-offline.json").write_text(
              json.dumps(
                  catalogo,
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )
          PY

      - name: Enviar arquivos para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4